- title: "Dissipation-Induced Nonreciprocal Current"
  short: "Finite-Γ nonlinear transport"
  status: current
  featured: true
  role: "Research project"
  people: "with Zhichao Guo and Prof. Hua Wang"
  period: "Apr 2026 – present"
  summary: >-
    Second-order DC response of dissipative quantum materials at finite relaxation rate Γ,
    toward a general tensorial framework for σ<sub>abc</sub>.
  highlights:
    - "Completed the analytic and computational derivation of the projected response σ<sub>xxx</sub> as the first concrete case of the general σ<sub>abc</sub> formulation; results are being organized toward a manuscript."
    - "Froze the exact finite-Γ compactification of the DC response: a one-thermal-master form with nine pointwise-exact minimal geometric generators. Under time-reversal symmetry over the full Brillouin zone the nine channels reduce to three, and at leading weak Γ a single channel gives the Γ⁻¹ nonreciprocal coefficient, replayable end-to-end via Wolfram scripts."
    - "Verified the crossover between low-temperature insulating O(Γ²) and high-temperature or metallic O(Γ) behaviour, with consistency checks for the DC limit, Γ dependence, band-index decomposition and multiband kernels."
  tags: [nonlinear transport, quantum geometry, Wolfram Language]

